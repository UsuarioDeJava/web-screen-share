name: Build and publish Docker image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - server/**
      - public/**
      - package.json
      - package-lock.json
      - .github/workflows/docker-publish.yml
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: App version
        id: version
        run: echo "value=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: web-screen-share:smoke-test
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}

      - name: Smoke test
        run: |
          docker run -d --name wss -p 3000:3000 web-screen-share:smoke-test
          for i in $(seq 1 20); do
            if docker logs wss 2>&1 | grep -q "TURN embutido ativo"; then break; fi
            sleep 1
          done
          docker logs wss
          docker logs wss 2>&1 | grep -q "TURN embutido ativo"
          curl -skf https://localhost:3000/version | grep -q '${{ steps.version.outputs.value }}'
          curl -skf https://localhost:3000/ice-servers | grep -q 'turn:localhost:3000?transport=tcp'
          python3 - <<'EOF'
          import os, socket, struct
          req = struct.pack('!HHI12s', 0x0001, 0, 0x2112A442, os.urandom(12))
          s = socket.create_connection(('127.0.0.1', 3000), timeout=5)
          s.sendall(req)
          resp = s.recv(1024)
          assert len(resp) >= 20 and struct.unpack('!I', resp[4:8])[0] == 0x2112A442, resp
          print('STUN/TURN respondeu na porta 3000, tipo 0x%04x' % struct.unpack('!H', resp[:2])[0])
          EOF

          # Certificado próprio (ex.: do Tailscale) deixado na pasta de dados.
          mkdir -p smoke-data
          openssl req -x509 -newkey rsa:2048 -nodes -days 30 \
            -keyout smoke-data/nas.example.ts.net.key -out smoke-data/nas.example.ts.net.crt \
            -subj "/CN=nas.example.ts.net" -addext "subjectAltName=DNS:nas.example.ts.net"
          docker run -d --name wss-cert -p 3001:3000 -v "$PWD/smoke-data:/data" web-screen-share:smoke-test
          for i in $(seq 1 20); do
            if docker logs wss-cert 2>&1 | grep -q "TURN embutido ativo"; then break; fi
            sleep 1
          done
          docker logs wss-cert
          docker logs wss-cert 2>&1 | grep -q "Usando o certificado nas.example.ts.net.crt"
          echo | openssl s_client -connect localhost:3001 2>/dev/null | openssl x509 -noout -subject | grep -q "nas.example.ts.net"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
