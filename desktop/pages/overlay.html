<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' https: http:" />
  <title>Web Screen Share (marcações)</title>
  <link rel="stylesheet" href="../shared/fx.css" />
  <link rel="stylesheet" href="overlay.css" />
  <link rel="stylesheet" href="../shared/visual-policy.css" />
</head>
<body>
  <div id="fx" class="fx"></div>
  <div id="cursors" class="cursors"></div>
  <div id="board" class="board"></div>
  <div id="control" class="control-banner" hidden>
    <span class="control-dot"></span>
    <span id="control-text"></span>
    <span id="control-keys"><kbd>Ctrl+Shift+X</kbd> tira o controle</span>
    <span id="control-list" hidden>pra tirar, clique no 🎮 da pessoa, na lista da sala</span>
  </div>
  <div id="hud" class="hud" hidden>
    <span class="hud-live"></span>
    <span class="hud-text">Desenhando na sua tela · quem assiste vê ao vivo</span>
    <span id="colors" class="hud-colors"></span>
    <button type="button" data-act="undo">Desfazer <kbd>Ctrl+Z</kbd></button>
    <button type="button" data-act="clear">Limpar <kbd>Del</kbd></button>
    <button type="button" data-act="exit" class="hud-exit">Sair <kbd>Esc</kbd></button>
  </div>
  <script src="../shared/fx.js"></script>
  <script src="../shared/visual-policy.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
