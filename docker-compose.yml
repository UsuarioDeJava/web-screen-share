services:
  web-screen-share:
    # Imagem já publicada — é isso que o CasaOS (e o `docker compose` em geral,
    # ao importar este arquivo sozinho) baixa e roda, sem precisar do código-fonte
    # nem buildar nada. Se preferir compilar você mesmo a partir deste repositório,
    # troque a linha abaixo por "build: ." (precisa clonar o repo antes).
    image: ghcr.io/usuariodejava/web-screen-share:latest
    container_name: web-screen-share
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - web-screen-share-data:/data
      # Pra usar um certificado de verdade (ex.: gerado com `tailscale cert` no
      # host) em vez do autoassinado, monte os arquivos e descomente junto com
      # as variáveis TLS_CERT/TLS_KEY abaixo.
      # - /caminho/no/host/seu-dominio.crt:/certs/cert.crt:ro
      # - /caminho/no/host/seu-dominio.key:/certs/cert.key:ro
    environment:
      - PORT=3000
      # - TLS_CERT=/certs/cert.crt
      # - TLS_KEY=/certs/cert.key
      # - TURN_URLS=
      # - TURN_USERNAME=
      # - TURN_CREDENTIAL=

volumes:
  web-screen-share-data:
