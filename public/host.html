<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transmissor — Web Screen Share</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>🖥️ Transmissor</h1>
    <div class="status">
      <span id="conn-dot" class="dot"></span>
      <span id="conn-text">conectando ao servidor...</span>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="row">
        <button id="btn-start" class="primary">Iniciar transmissão</button>
        <button id="btn-stop" class="danger" disabled>Parar transmissão</button>
        <label class="row" style="gap: 6px;">
          <input type="checkbox" id="chk-audio" checked />
          Capturar áudio do sistema (se o navegador suportar)
        </label>
      </div>
      <p class="hint" id="audio-hint"></p>
    </div>

    <div class="card">
      <video id="preview" autoplay playsinline muted></video>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Compartilhe este link com quem for assistir</h3>
      <div id="urls"></div>
      <p class="hint">Use o endereço da sua rede local ou o IP do Tailscale (não use "localhost" fora deste PC).</p>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Visualizadores conectados (<span id="viewer-count">0</span>)</h3>
      <ul class="viewer-list" id="viewer-list"></ul>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/quality.js"></script>
  <script src="js/host.js"></script>
</body>
</html>
