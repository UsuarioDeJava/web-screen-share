<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web Screen Share</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%235b6cff'/%3E%3Cg fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='4' y='5' width='16' height='11' rx='1.5'/%3E%3Cpath d='M9 19.5h6M12 16v3.5'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <section id="login" class="login">
    <form id="login-form" class="login-card" autocomplete="off">
      <div class="login-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4M9 10l3-3 3 3M12 7v6"/></svg>
      </div>
      <h1>Web Screen Share</h1>
      <p class="login-sub">Escolha um nick pra entrar na sala.</p>
      <input id="nick" name="nick" maxlength="24" placeholder="Seu nick" aria-label="Seu nick" autofocus />
      <button type="submit" id="login-btn" class="btn btn-primary">Entrar</button>
      <p id="login-error" class="login-error" role="alert"></p>
      <p class="login-hint">Sem senha: o nick só vale enquanto você estiver na sala.</p>
    </form>
  </section>

  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="sidebar-head">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </span>
        Sala
      </div>
      <div class="sidebar-section">Na sala — <span id="user-count">0</span></div>
      <ul id="user-list" class="user-list"></ul>
      <div class="me">
        <span id="me-avatar" class="avatar"></span>
        <div class="me-info">
          <div id="me-name" class="me-name"></div>
          <div class="me-status"><span id="conn-dot" class="dot"></span><span id="conn-text"></span></div>
        </div>
        <button id="btn-leave" class="icon-btn" type="button" title="Sair da sala" aria-label="Sair da sala">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h2>Transmissões</h2>
          <span id="live-count" class="live-count"></span>
        </div>
        <div class="topbar-actions">
          <span id="share-hint" class="share-hint" hidden></span>
          <button id="btn-share" class="btn btn-primary" type="button"></button>
        </div>
      </header>

      <div class="stage">
        <div id="grid" class="grid"><div id="grid-inner" class="grid-inner"></div></div>
        <div id="empty" class="empty">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </div>
          <strong>Ninguém está transmitindo agora</strong>
          <span id="empty-hint">Clique em <b>Compartilhar tela</b> pra começar.</span>
        </div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/quality.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
